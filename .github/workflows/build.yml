name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: soulbind
          path: build/libs/*.jar
      # Publishes the jar on the repository's Releases page as a direct download.
      - run: gh release create "build-${{ github.run_number }}" build/libs/*.jar --title "Soul Bind build ${{ github.run_number }}" --notes "Automatic build."
        env:
          GH_TOKEN: ${{ github.token }}
