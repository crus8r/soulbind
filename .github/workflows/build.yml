name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle build
      - name: Diagnostics
        if: failure()
        run: |
          for j in $(find ~/.gradle . -name "*.jar" -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/storage/loot/LootContext.class"; then
              echo "JAR $j"
              javap -cp "$j" net.minecraft.world.level.storage.loot.LootContext net.minecraft.world.entity.player.Inventory net.minecraft.world.inventory.AnvilMenu net.minecraft.world.inventory.ItemCombinerMenu
              break
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: soulbind
          path: build/libs/*.jar
      # Publishes the jar on the repository's Releases page as a direct download.
      - run: gh release create "build-${{ github.run_number }}" build/libs/*.jar --title "Soul Bind build ${{ github.run_number }}" --notes "Automatic build."
        env:
          GH_TOKEN: ${{ github.token }}
