name: diag
on: [push]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle compileJava -q || true
      - run: |
          j=$(find ~/.gradle -name "minecraft-merged-deobf-26.3.jar" | head -1)
          echo "=====ENTITY"
          javap -p -cp "$j" net.minecraft.world.entity.Entity | grep -iE "tag"
          echo "=====RESPAWN"
          javap -p -c -cp "$j" net.minecraft.server.players.PlayerList | awk '/ServerPlayer respawn\(/{p=1} p{print} p&&/^$/{p=0}' | grep -iE "respawn|tag|restoreFrom"
          echo "=====PARTICLES"
          javap -p -cp "$j" net.minecraft.server.level.ServerLevel | grep -i "sendParticles"
          echo "=====HURT"
          javap -p -cp "$j" net.minecraft.world.item.ItemStack | grep -iE "hurtAndBreak"
