name: build-neoforge
on:
  push:
    branches: [neoforge]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - name: Check mixin targets exist in NeoForge's Minecraft
        run: |
          for j in $(find ~/.gradle build -name "*.jar" -size +1M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/entity/player/Inventory.class"; then
              echo "JAR $j"
              javap -p -cp "$j" net.minecraft.world.entity.player.Inventory | grep "void dropAll()"
              javap -p -cp "$j" net.minecraft.world.inventory.AnvilMenu | grep "void createResult()"
              javap -p -cp "$j" net.minecraft.world.inventory.AnvilMenu | grep "void onTake("
              javap -p -cp "$j" net.minecraft.world.entity.player.Player | grep "int getBaseExperienceReward("
              exit 0
            fi
          done
          echo "Minecraft jar not found"; exit 1
      - name: Diagnostics
        if: failure()
        run: |
          for j in $(find ~/.gradle build -name "*.jar" -size +1M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/neoforged/neoforge/common/loot/LootModifier.class"; then
              echo "=====JAR $j"
              javap -p -cp "$j" net.neoforged.neoforge.common.loot.LootModifier net.neoforged.neoforge.common.loot.IGlobalLootModifier 'net.neoforged.neoforge.registries.NeoForgeRegistries$Keys' 'net.neoforged.neoforge.event.entity.player.PlayerEvent$Clone' net.neoforged.neoforge.event.entity.living.LivingDeathEvent 'net.neoforged.neoforge.event.tick.ServerTickEvent' net.minecraft.world.level.storage.loot.LootContext | grep -vE "^\s*private"
              break
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: soulbind-neoforge
          path: build/libs/*.jar
      - run: gh release create "neoforge-build-${{ github.run_number }}" build/libs/*.jar --title "Soul Bind for NeoForge, build ${{ github.run_number }}" --notes "Automatic build."
        env:
          GH_TOKEN: ${{ github.token }}
