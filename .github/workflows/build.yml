name: build-forge-1.20.1
on:
  push:
    branches: [forge-1.20.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --warning-mode none 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Fail if any mixin target was not found
        run: |
          if grep -iE "Cannot find target|Unable to locate obfuscation mapping|not found in target" build.log; then exit 1; fi
          ls -la build/libs
          unzip -l build/libs/*.jar | grep -E "refmap|mixins.json|mods.toml"
          unzip -p build/libs/*.jar soulbind.refmap.json | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: soulbind-forge-1.20.1
          path: build/libs/*.jar
      - run: gh release create "forge-1.20.1-build-${{ github.run_number }}" build/libs/*.jar --title "Soul Bind for Forge 1.20.1, build ${{ github.run_number }}" --notes "Automatic build."
        env:
          GH_TOKEN: ${{ github.token }}
