name: diag
on: [push]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - run: gradle compileJava -q
      - run: |
          j=$(find ~/.gradle -name "minecraft-merged-deobf-26.3.jar" | head -1)
          echo "JAR $j"
          javap -p -c -cp "$j" net.minecraft.world.entity.player.Inventory net.minecraft.world.entity.EntityEquipment net.minecraft.world.entity.player.Player net.minecraft.server.level.ServerPlayer net.minecraft.world.entity.LivingEntity > all.txt
          for m in "public void dropAll" "public int getContainerSize" "public net.minecraft.world.item.ItemStack getItem(int)" "public void setItem(int" "void dropEquipment" "int getBaseExperienceReward" "void restoreFrom" "public void die(" "void dropAllDeathLoot" "void dropExperience" "int getExperienceReward" "static {}" ; do
            echo "=====METHOD $m"
            awk -v m="$m" 'index($0,m){p=1} p{print} p&&/^$/{p=0}' all.txt | grep -E "^Compiled|^  [a-z]|invoke|getfield|putfield|getstatic|ldc|bipush|sipush|iconst|if|goto|return" | head -400
          done
